<!DOCTYPE html>

<html lang="en" data-bs-theme="dark">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Investment Manager</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
	<div class="container-fluid">
		<a class="navbar-brand" href="/">Investment Manager</a>
		<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
			<span class="navbar-toggler-icon"></span>
		</button>
		<div class="collapse navbar-collapse" id="navbarNav">
			<ul class="navbar-nav">
				<li class="nav-item">
					<a class="nav-link" href="dashboard.html">Dashboard</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" href="spending.html">Spending</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" href="investing.html">Investing</a>
				</li>
			</ul>
		</div>
	</div>
</nav>
<div class="row">
	<div class="col-8">
		<div class="card-group mx-3">
			<div class="card text-center mb-3" style="width: 24rem;">
				<div class="card-body">
					<h5 class="card-title">Savings Goal</h5>
					<canvas id="savingsChart" style="width:100%;max-width:600px"></canvas>
					<a href="investing.html" class="btn btn-outline-info">View Savings</a>
				</div>
			</div>
		</div>
	</div>
	<div class="col-4">
		<div class="card-group mx-3">
			<div class="card text-center mb-3" style="width: 24rem;">
				<div class="card-body text-success">
					<h5 class="card-title">Investment Income</h5>
					<p class="card-text fs-2">+$254.25</p>
					<p class="card-text"><small class="text-body-secondary">Over last month</small></p>
					<a href="investing.html" class="btn btn-outline-info">Investments</a>
				</div>
			</div>
			<div class="card text-center mb-3" style="width: 24rem;">
				<div class="card-body text-danger">
					<h5 class="card-title">Outstanding Debt</h5>
					<p class="card-text fs-2">-$1076.32</p>
					<p class="card-text"><small class="text-body-secondary">Over last month</small></p>
					<a href="investing.html" class="btn btn-outline-info">Debt Tracker</a>
				</div>
			</div>
		</div>
	</div>
</div>
<div class="row">
	<div class="col-8">
		<div class="card-group mx-3">
			<div class="card text-center mb-3" style="width: 24rem;">
				<div class="card-body">
					<h5 class="card-title">Monthly Spending</h5>
					<canvas id="spendingChart" style="width:100%;max-width:600px"></canvas>
					<a href="spending.html" class="btn btn-outline-info">Spending Breakdown</a>
				</div>
			</div>
		</div>
	</div>
	<div class="col-4">
		<div class="card-group mx-3">
			<div class="card text-center mb-3" style="width: 24rem;">
				<div class="card-body text-warning">
					<h5 class="card-title">Credit Score</h5>
					<p class="card-text fs-1">673</p>
					<a href="spending.html" class="btn btn-outline-info">Details</a>
				</div>
			</div>
		</div>
	</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js">
</script>

<script>
	const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
	const spendingValues = [7500, 8000, 7600, 7200, 7300, 8200, 8300, 7100, 6900, 7200, 7400, 8500];
	new Chart("spendingChart", {
		type: "line",
		data: {
			labels: months,
			datasets: [{
			 	data: spendingValues,
			 	label: "Total Spending",
			 	borderColor: 'rgba(20, 100, 20, 1.0)',
			 	lineTension: 0.0,
			 	fill: false
			}]
		},
	  	options: {
			title: {
				display: true,
		 		text: "Monthly Expenses"
			}
	 	},
	});
	const savingsValues = [7500, 8000, 7600, 7200, 7300, 8200, 8300, 7100, 6900, 7200, 7400, 8500];
	new Chart("savingsChart", {
		type: "line",
		data: {
			labels: months,
			datasets: [{
			 	data: savingsValues,
			 	label: "Total Savings",
			 	borderColor: 'rgba(20, 100, 20, 1.0)',
			 	lineTension: 0.0,
			 	fill: false
			}]
		},
	  	options: {
			title: {
				display: true,
		 		text: "Monthly Savings"
			}
	 	},
	});
</script>

</body>
</html>
