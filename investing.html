<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Investment Manager</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
	<div class="container-fluid">
		<a class="navbar-brand" href="/">Investment Manager</a>
		<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
			<span class="navbar-toggler-icon"></span>
		</button>
		<div class="collapse navbar-collapse" id="navbarNav">
			<ul class="navbar-nav">
				<li class="nav-item">
					<a class="nav-link" href="dashboard.html">Dashboard</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" href="spending.html">Spending</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" href="investing.html">Investing</a>
				</li>
			</ul>
		</div>
	</div>
</nav>
<div class="row">
	<div class="col-12">
		<div class="card-group mx-3">
			<div class="card text-center mb-3" style="width: 24rem;">
				<div class="card-body">
					<h5 class="card-title">Total Assets</h5>
					<canvas id="valueChart" style="width:100%;max-width:600px"></canvas>
				</div>
			</div>
		</div>
	</div>
</div>
<form class="row g-4">
	<div class="col-6">
		<input type="text" class="form-control" placeholder="Search News" aria-label="Search News">
	</div>
	<div class="col-6">
		<button type="submit" class="btn btn-outline-info mb-3">Search</button>
	</div>
</form>
<div class="row row-cols-1 row-cols-md-3 g-4">
	<div class="col">
		<div class="card-group mx-3">
			<div class="card text-center mb-3" style="width: 24rem;">
				<div class="card-body">
					<h5 class="card-title">Stock (GOOGL)</h5>
					<div class="card-group">
						<div class="card text-center mb-3">
							<div class="card-body text-info">
								<h5 class="card-title">Current Value</h5>
								<p class="card-text fs-1">$4203.43</p>
							</div>
						</div>
						<div class="card text-center mb-3">
							<div class="card-body text-success">
								<h5 class="card-title">Trend</h5>
								<p class="card-text fs-1">+4.32%</p>
							</div>
						</div>
					</div>
				</div>
				<button type="button" class="btn btn-outline-info">Edit</button>
			</div>
		</div>
	</div>
	<div class="col">
		<div class="card-group mx-3">
			<div class="card text-center mb-3" style="width: 24rem;">
				<div class="card-body">
					<h5 class="card-title">Bitcoin</h5>
					<div class="card-group">
						<div class="card text-center mb-3">
							<div class="card-body text-info">
								<h5 class="card-title">Current Value</h5>
								<p class="card-text fs-1">$594.26</p>
							</div>
						</div>
						<div class="card text-center mb-3">
							<div class="card-body text-danger">
								<h5 class="card-title">Trend</h5>
								<p class="card-text fs-1">-2.69%</p>
							</div>
						</div>
					</div>
				</div>
				<button type="button" class="btn btn-outline-info">Edit</button>
			</div>
		</div>
	</div>
	<div class="col">
		<div class="card-group mx-3">
			<div class="card text-center mb-3" style="width: 24rem;">
				<div class="card-body">
					<h5 class="card-title">Collection Items</h5>
					<div class="card-group">
						<div class="card text-center mb-3">
							<div class="card-body text-info">
								<h5 class="card-title">Current Value</h5>
								<p class="card-text fs-1">$892.59</p>
							</div>
						</div>
						<div class="card text-center mb-3">
							<div class="card-body text-success">
								<h5 class="card-title">Trend</h5>
								<p class="card-text fs-1">+13.14%</p>
							</div>
						</div>
					</div>
				</div>
				<button type="button" class="btn btn-outline-info">Edit</button>
			</div>
		</div>
	</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js">
</script>

<script>
	const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
	const assetValues = [7500, 8000, 7600, 7200, 7300, 8200, 8300, 7100, 6900, 7200, 7400, 8500];
	new Chart("valueChart", {
		type: "line",
		data: {
			labels: months,
			datasets: [{
			 	data: assetValues,
			 	label: "Total Value",
			 	borderColor: 'rgba(20, 100, 20, 1.0)',
			 	lineTension: 0.0,
			 	fill: false
			}]
		},
	  	options: {
			title: {
				display: true,
		 		text: "Monthly Expenses"
			}
	 	},
	});
</script>

</body>
</html>
